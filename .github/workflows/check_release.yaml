name: APK Extractor and Release Publisher

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 15 * * *' # Roda todos os dias às 12:00 (Meio-dia no Horário de Brasília)
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Garante o histórico de commits completo para ler a tag anterior

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install required dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run APK Extractor Bot
      id: bot
      run: python check_builds.py

    # Passo ajustado para gerar as notas de lançamento comparando com a tag anterior
    - name: Generate Automatic Release Notes
      if: steps.bot.outputs.tag != ''
      id: generate_notes
      run: |
        NOTES=$(gh api /repos/${{ github.repository }}/releases/generate-notes \
          -f tag_name="${{ steps.bot.outputs.tag }}" \
          -f target_commitish="main" \
          --jq '.body')
        
        echo "AUTOMATIC_CHANGELOG<<EOF" >> $GITHUB_ENV
        echo "$NOTES" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create and Publish GitHub Release
      if: steps.bot.outputs.tag != ''
      run: |
        # Cria a release direto, anexando os APKs e injetando o Changelog automático no fim
        gh release create "${{ steps.bot.outputs.tag }}" downloaded_apks/* \
          --title "${{ steps.bot.outputs.tag }}-RetroArch" \
          --notes "> **Commits do repositorio**: https://github.com{{ steps.bot.outputs.tag }}
        
        - Link: **https://libretro.com**
        - Código fonte: **https://libretro.com/latest/**
        
        ${{ env.AUTOMATIC_CHANGELOG }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
