name: APK Extractor and Release Publisher

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 15 * * *' # Roda todos os dias às 12:00 (Meio-dia no Horário de Brasília)
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Carrega o histórico completo para a busca de tags funcionar

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install required dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run APK Extractor Bot
      id: bot
      run: python check_builds.py

    - name: Generate Release Notes File
      if: steps.bot.outputs.tag != ''
      run: |
        NEW_TAG="${{ steps.bot.outputs.tag }}"
        
        # Pega a lista das últimas tags e filtra para extrair a anterior real (pulando a nova)
        PREVIOUS_TAG=$(gh release list --limit 10 --json tagName --jq '.[].tagName' 2>/dev/null | grep -v "^${NEW_TAG}$" | head -n 1 || echo "")
        
        # Caso seja a primeira build do repositório e não exista anterior, define a tag base de segurança
        if [ -z "$PREVIOUS_TAG" ]; then
          PREVIOUS_TAG="v2026-09-26"
        fi
        
        echo "Tag Anterior encontrada: $PREVIOUS_TAG"
        echo "Tag Atual encontrada: $NEW_TAG"
        
        # Monta o arquivo de notas com o espaçamento e os links corretos da Libretro
        echo "> **Commits do repositorio**: https://github.com{PREVIOUS_TAG}...${NEW_TAG}" > release_notes.txt
        echo "" >> release_notes.txt
        echo "- Link: **https://buildbot.libretro.com/nightly/android/**" >> release_notes.txt
        echo "- Código fonte: **https://buildbot.libretro.com/nightly/android/latest/**" >> release_notes.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create and Publish GitHub Release
      if: steps.bot.outputs.tag != ''
      run: |
        NEW_TAG="${{ steps.bot.outputs.tag }}"
        gh release create "$NEW_TAG" downloaded_apks/* \
          --title "${NEW_TAG}-RetroArch" \
          --notes-file release_notes.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
