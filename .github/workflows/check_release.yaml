name: APK Extractor and Release Publisher

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 15 * * *' # Roda todos os dias às 12:00 (Meio-dia no Horário de Brasília)
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install required dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run APK Extractor Bot
      id: bot
      run: python check_builds.py

    - name: Create and Publish GitHub Release
      if: steps.bot.outputs.tag != ''
      run: |
        NEW_TAG="${{ steps.bot.outputs.tag }}"
        
        # Busca dinamicamente o nome da última tag lançada antes desta execução
        PREVIOUS_TAG=$(gh release list --limit 1 --json tagName --jq '..tagName' 2>/dev/null || echo "")
        
        if [ -z "$PREVIOUS_TAG" ] || [ "$PREVIOUS_TAG" = "$NEW_TAG" ]; then
          PREVIOUS_TAG="v2026-09-26"
        fi
        
        # Cria o arquivo de notas de forma blindada, sem risco do Linux cortar ou errar as barras
        cat << EOF > release_notes.txt
> **Commits do repositorio**: https://github.com{{ github.repository }}/compare/${PREVIOUS_TAG}...${NEW_TAG}

- Link: **https://buildbot.libretro.com/nightly/android/**
- Código fonte: **https://buildbot.libretro.com/nightly/android/latest/**
EOF

        # Publica a release oficial aplicando as notas limpas e exatas do arquivo
        gh release create "$NEW_TAG" downloaded_apks/* \
          --title "${NEW_TAG}-RetroArch" \
          --notes-file release_notes.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
