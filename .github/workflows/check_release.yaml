name: Bot Extrator e Publicador de Releases

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Executar o Bot Extrator
      run: python script.py

    - name: Definir Tag da Release
      id: get_tag
      run: |
        if [ -f tag_name.txt ]; then
          TAG=$(cat tag_name.txt)
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
        else
          echo "Nenhum arquivo novo para processar hoje."
          exit 0
        fi

    - name: Criar GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: ${{ env.RELEASE_TAG }}
        body: ""
        draft: false
        prerelease: false
        files: apks_baixados/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
