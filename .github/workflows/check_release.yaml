name: APK Extractor and Release Publisher

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 15 * * *' # Roda todos os dias às 15:00 UTC (12:00 no Horário de Brasília)
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install required dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run APK Extractor Bot
      id: bot
      run: python check_builds.py

    - name: Create and Publish GitHub Release
      if: steps.bot.outputs.tag != ''
      run: |
        gh release delete "${{ steps.bot.outputs.tag }}" --yes || true
        
        gh release create "${{ steps.bot.outputs.tag }}" downloaded_apks/* \
          --title "${{ steps.bot.outputs.tag }}" \
          --notes "Automated nightly build."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
