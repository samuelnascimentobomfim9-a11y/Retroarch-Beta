name: APK Extractor and Release Publisher

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install required dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    # Ajustado para executar o arquivo correto do seu repositório
    - name: Run APK Extractor Bot
      run: python check_builds.py

    - name: Create and Publish GitHub Release
      if: env.RELEASE_TAG != ''
      run: |
        gh release delete "${{ env.RELEASE_TAG }}" --yes || true
        
        gh release create "${{ env.RELEASE_TAG }}" downloaded_apks/* \
          --title "${{ env.RELEASE_TAG }}" \
          --notes "Automated nightly build."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
